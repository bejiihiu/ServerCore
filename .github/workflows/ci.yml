name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  plugin:
    name: plugin (folia)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: set up jdk 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: set up gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      - name: build plugin
        run: ./gradlew build

  backend:
    name: backend (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          # pinned to the version the project is developed and tested on, so a
          # toolchain release cannot change what ci measures overnight
          bun-version: "1.4.2"

      - name: install deps
        run: bun install --frozen-lockfile
        working-directory: backend

      - name: typecheck
        run: bun run typecheck
        working-directory: backend

      - name: test
        run: bun test
        working-directory: backend

  shellcheck:
    name: shellcheck (deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --version

      - name: lint deploy scripts
        # -x follows the sourced lib.sh; the scripts are the operator surface
        # for backup/restore, so a lint failure is a real failure here
        run: shellcheck -x deploy/*.sh deploy/backup/*.sh
