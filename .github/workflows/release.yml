name: Release

on:
  push:
    tags:
      - "build-*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build plugin jar
        run: ./gradlew :plugin:build --no-daemon

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build backend bundle
        working-directory: backend
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test

      - name: Package backend bundle
        working-directory: backend
        run: |
          mkdir -p ../dist
          tar -czf ../dist/servercore-backend-${GITHUB_REF_NAME}.tar.gz \
            --exclude=node_modules \
            --exclude=.env \
            package.json bun.lock tsconfig.json src tests .env.example Dockerfile .dockerignore

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            plugin/build/libs/*.jar
            dist/*.tar.gz
