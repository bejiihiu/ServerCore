# automated dependency updates: one grouped PR per ecosystem and week for
# minor/patch, majors stay one-PR-per-dependency so a breaking bump is read on
# its own. merges are manual on purpose: every PR still goes through ci.yml.
#
# review requests come from .github/CODEOWNERS: the `reviewers` key was retired
# from dependabot.yml in may 2025, and CODEOWNERS is what replaced it.
version: 2

updates:
  # ---- backend (bun) --------------------------------------------------------
  - package-ecosystem: "bun"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    assignees:
      - "bejiihiu"
    groups:
      bun-non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ---- plugin (gradle) ------------------------------------------------------
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    assignees:
      - "bejiihiu"
    groups:
      gradle-non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ---- workflows ------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    assignees:
      - "bejiihiu"
    groups:
      actions-non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
