# every version below was checked against its upstream registry on 2026-11-25
# (maven-metadata.xml or plugins.gradle.org). the comment above each block names
# the repository it resolves from and the channel it is on: "stable" here means
# the newest release that is not a snapshot/eap, nothing more.
[versions]
# kotlinlang stable channel, maven central. 2.5.0 is planned for dec 2026
kotlin = "2.4.21"
# papermc maven-public: "-stable" is part of the version string, not a label we
# add. 26.3 is the minecraft line and has to match the server we run
folia-api = "26.3.build.27-stable"
minecraft = "26.3"

# gradle plugin portal, stable channel
shadow = "9.6.1"
run-paper = "3.1.0"

# maven central, stable channel
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.13.0"
# junit 6.x line — jupiter and the platform launcher must move together
junit = "6.1.3"

# api-only artifacts the server already ships; compileOnly, never bundled.
# packetevents comes from codemc maven-releases, placeholderapi from
# repo.helpch.at/releases, the other two from maven central
packetevents = "2.14.0"
luckperms = "5.5"
placeholderapi = "2.12.3"
flectonepulse = "1.15.2"

[libraries]
folia-api = { module = "dev.folia:folia-api", version.ref = "folia-api" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

packetevents-spigot = { module = "com.github.retrooper:packetevents-spigot", version.ref = "packetevents" }
luckperms-api = { module = "net.luckperms:api", version.ref = "luckperms" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
flectonepulse-api = { module = "net.flectone.pulse:api", version.ref = "flectonepulse" }

# the test framework tracks the kotlin version, so it shares that ref
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
