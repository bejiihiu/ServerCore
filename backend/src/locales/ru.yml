# ServerCore canonical locale: ru
#
# the single source of truth for every player-facing string: toolkit surfaces
# (tab list, welcome, auth window, countdown) and feature copy (guest lifecycle,
# observation, protection denials, permission debug, placeholder values).
#
# this seed ships inside the plugin jar and serves as the fallback until the
# backend pushes the current full file over the ws channel (LOCALE_PUSH).
# templates are miniMessage; color tags are the plugin theme tokens
# (<primary> <secondary> <muted> <hairline> <gold> <ok> <warn> <danger> <info>),
# never vanilla color names. placeholders use {name} syntax and their values
# are escaped before injection.
#
# copy rules: lowercase headers, no exclamation marks, no trailing periods on
# short lines, one thought per line. the tone is a quiet gatekeeper, not a
# salesman.

tablist:
  header: "<gold>◆</gold> <primary>закрытый сезон</primary>"
  footer: "<muted>вторая волна · доступ по пропуску</muted>"

guest:
  welcome:
    title: "<primary>гостевой пропуск</primary>"
    subtitle: "<secondary>сессия <gold>{n}</gold> из <gold>{max}</gold> · мир открыт для осмотра</secondary>"
    card: |
      <gold>гостевой пропуск</gold>
      <secondary>мир открыт для осмотра, взаимодействие ограничено</secondary>
      <secondary>сессия <gold>{n}</gold> из <gold>{max}</gold></secondary>
      <muted>полный доступ открывается после одобрения заявки</muted>
  welcome-back:
    subtitle: "<secondary>точка входа восстановлена · сессия <gold>{n}</gold> из <gold>{max}</gold></secondary>"
  link-prompt:
    - "<secondary>играть можно после регистрации в Telegram-боте</secondary>"
    - "<secondary>ссылка для входа</secondary> <click:open_url:'{link}'><underlined><gold>{link}</gold></underlined></click>"
  restriction:
    actionbar: "<danger>гостевой режим: действие закрыто · регистрация — /link</danger>"
  reminder:
    actionbar: "<secondary>регистрация:</secondary> <gold>{link}</gold>"
  limit:
    warning:
      title: "<danger>лимит гостевых сессий</danger>"
      subtitle: "<secondary>регистрация в Telegram-боте открывает игру</secondary>"
    last-session: "<warn>последняя гостевая сессия</warn> <muted>·</muted> <secondary>регистрация в боте</secondary>"
    chat:
      - "<danger>гостевые сессии закончились: {limit} из {limit}</danger>"
      - "<secondary>мир открыт до выхода · игра — после регистрации</secondary>"
      - "<gold>{link}</gold>"
  mute-notice: "<secondary>сейчас действует мут — чат молчит до его окончания</secondary>"
  kick:
    limit:
      - "<danger>гостевые сессии исчерпаны: {limit}</danger>"
      - "<secondary>регистрация в Telegram-боте открывает игру</secondary>"
      - "<gold>{link}</gold>"
    banned:
      - "<danger>доступ к серверу ограничен</danger>"
      - "<secondary>если это ошибка — напишите администрации в боте</secondary>"
    disabled:
      - "<danger>вход на сервер — только по регистрации</danger>"
      - "<secondary>пройдите её в Telegram-боте</secondary>"
      - "<gold>{link}</gold>"

auth:
  prompt:
    card: |
      <gold>подтверждение входа</gold>
      <secondary>код: <bold><gold>{code}</gold></bold></secondary>
      <secondary>отправьте код боту — он подтвердит вход</secondary>
      <muted>без подтверждения сессия закроется по таймеру</muted>
  pulse: "<primary>код <gold>{code}</gold> — подтвердите вход в боте</primary>"
  window: "<gold>{code}</gold> <muted>·</muted> <secondary>осталось {time}</secondary>"
  expired: "окно подтверждения истекло"
  approved:
    title: "<ok>доступ открыт</ok>"
    subtitle: "<secondary>регистрация подтверждена · гостевой режим снят</secondary>"

# disconnect screen when the backend revoked the account
account:
  revoked:
    - "<danger>аккаунт удалён</danger>"
    - "<secondary>доступ отозван · если это ошибка — напишите в бот</secondary>"

spec:
  inventory-title: "<secondary>инвентарь</secondary> <muted>·</muted> <gold>{target}</gold>"
  started: "<ok>наблюдение</ok> <primary>{target}</primary> <secondary>· завершить — /spec</secondary>"
  exited: "<ok>наблюдение завершено, состояние восстановлено</ok>"
  aborted: "<danger>наблюдение за {target} не началось</danger>"
  disabled: "<danger>наблюдение отключено на этом сервере</danger>"
  no-target: "<danger>{target} не в сети</danger>"
  self: "<danger>нельзя наблюдать за собой</danger>"
  busy-admin: "<danger>вы уже наблюдаете за {target} · завершите сессию</danger>"
  busy-target: "<danger>за {target} уже наблюдает другой сотрудник</danger>"
  not-observing: "<secondary>вы ни за кем не наблюдаете</secondary>"
  denied-permission: "<danger>нет доступа к наблюдению</danger>"
  denied-level: "<danger>уровень доступа {target} выше вашего</danger>"

protection:
  denied:
    chat: "<danger>команда <bold>{command}</bold> недоступна на этом сервере</danger>"

# admin debug command: /servercore groups <player>
luckperms:
  groups:
    usage: "<secondary>использование:</secondary> <gold>/servercore groups {arg}</gold>"
    no-permission: "<danger>нет прав на эту команду</danger>"
    player-not-found: "<danger>{player} не в сети</danger>"
    header: "<secondary>группы</secondary> <primary>{player}</primary>"
    entry: "<muted>▸</muted> <primary>{group}</primary><muted>{primary}</muted>"
    primary-mark: " · основная"
    none: "<muted>игрок не состоит в группах</muted>"
    lookup-failed: "<danger>не удалось прочитать группы · подробности в логе</danger>"

# values %servercore_*%: plain text for placeholderapi, no tags
placeholders:
  "yes": "да"
  "no": "нет"
  status:
    active: "активен"
    banned: "заблокирован"
    guest: "гость"
  application:
    voting: "на голосовании"
    approved: "одобрена"
    rejected: "отклонена"
    expired: "истекла"
  last-seen:
    now: "сейчас"
    minutes: "{n} мин назад"
    hours: "{n} ч назад"
    days: "{n} дн назад"
  duration:
    h: "{n}ч"
    m: "{n}м"
    s: "{n}с"

countdown:
  tick: "<secondary>время на исходе</secondary>"

# /servercore diag: самопроверка оператора. секции повторяют модель отчёта;
# находки без тегов — цвет выдаёт карточка по важности
diag:
  header: "<gold>диагностика</gold> <muted>·</muted> <secondary>{version}</secondary>"
  section:
    build: "<gold>сборка</gold>"
    modules: "<gold>модули</gold>"
    link: "<gold>связь с бэкендом</gold>"
    counts: "<gold>счётчики</gold>"
    versions: "<gold>версии</gold>"
    verdict: "<gold>вердикт</gold>"
  label:
    plugin: "плагин"
    jar: "jar"
    server: "сервер"
    folia: "folia"
    java: "java"
    link: "связь"
    heartbeat: "последний heartbeat"
    outbox: "outbox"
    last-disconnect: "последний разрыв"
    reconnect-attempts: "попытки переподключения"
    guests: "гости"
    spec-sessions: "spec-сеансы"
    bars: "бары"
    players: "игроки"
  module:
    guest: "гостевой режим"
    packet: "пакетный слой"
    anti-esp: "anti-esp"
    protection: "защита"
    spec: "spec"
    bars: "бары"
    luckperms: "luckperms"
    placeholderapi: "placeholderapi"
    flectonepulse: "flectonepulse"
  status:
    enabled: "<ok>включён</ok>"
    disabled: "<muted>выключен в конфиге</muted>"
    absent: "<warn>нет зависимости</warn>"
    failed: "<danger>сбой</danger>"
  detail:
    packet-idle: "пакетный слой простаивает"
    all-bars-off: "все бары выключены"
    static-fallback: "статический фолбэк из конфига"
    fp-incompatible: "версия api не поддерживается"
    fp-connecting: "ещё подключается"
  value:
    "yes": "<ok>да</ok>"
    "no": "<warn>нет</warn>"
    connected: "<ok>подключено</ok>"
    disconnected: "<danger>нет связи</danger>"
    absent: "<muted>отсутствует</muted>"
    never: "<muted>никогда</muted>"
    none: "<muted>нет</muted>"
  version:
    packetevents: "packetevents"
    luckperms: "luckperms"
    placeholderapi: "placeholderapi"
    flectonepulse: "flectonepulse"
  finding:
    packet-offline: "пакетный слой не работает: anti-esp, маскировка и просмотр инвентаря выключены"
    backend-down: "связь с бэкендом потеряна: авторизация и события модерации недоступны"
    guest-failed: "гостевой режим включён в конфиге, но сессионная машина не поднялась"
    protection-failed: "защита включена в конфиге, но её сторожа не поднялись"
    spec-failed: "spec включён в конфиге, но сессионная машина не поднялась"
    esp-failed: "anti-esp включён в конфиге, но движок не поднялся"
    bars-failed: "бары включены в конфиге, но рендерер не поднялся"
    heartbeat-stale: "нет трафика от бэкенда уже {seconds} с, хотя связь считается живой"
    outbox-backlog: "в outbox лежит {count} кадр(ов): бэкенд не подтверждает доставку"
    anti-esp-disabled: "anti-esp выключен в конфиге: клиенты видят всё"
    protection-disabled: "защита выключена в конфиге: командные и gamemode-сторожа не работают"
    luckperms-absent: "luckperms не установлен: права берутся из статической карты конфига"
    flectonepulse-incompatible: "версия api flectonepulse не та: проверка наказаний выключена"
    flectonepulse-absent: "flectonepulse не установлен: проверка наказаний выключена"
    placeholderapi-absent: "placeholderapi не установлен: плейсхолдеры %servercore_*% недоступны"
  hint:
    install-packetevents: "<secondary>поставьте packetevents 2.14.x: anti-esp работает через пакетный слой</secondary>"
    start-backend: "<secondary>запустите бэкенд и сверьте backend.url и общий секрет</secondary>"
    check-config: "<secondary>смотрите лог загрузки: включённый модуль не поднялся</secondary>"
    drain-outbox: "<secondary>outbox разберётся сам, когда бэкенд начнёт подтверждать кадры</secondary>"
    check-network: "<secondary>проверьте сеть между сервером и бэкендом</secondary>"
    install-luckperms: "<secondary>поставьте luckperms: без него нет прав и /servercore groups</secondary>"
    install-flectonepulse: "<secondary>поставьте flectonepulse: без него нет проверки наказаний</secondary>"
    update-flectonepulse: "<secondary>обновите flectonepulse до сборки 1.15.x</secondary>"
    enable-anti-esp: "<secondary>включите anti-esp.enabled, чтобы игроки скрывались за укрытиями</secondary>"
    enable-protection: "<secondary>включите protection.enabled, чтобы вернуть сторожей</secondary>"
  verdict:
    ok: "<ok>OK</ok> <muted>·</muted> <secondary>все включённые модули работают</secondary>"
    warn: "<warn>WARN</warn> <muted>·</muted> <secondary>проблемы: {count}</secondary>"
    fail: "<danger>FAIL</danger> <muted>·</muted> <secondary>блокеры: {count}</secondary>"

# server info bars: /rambar, /tpsbar, /msptbar, /playersbar, /worldbar и
# /netbar. заголовок бара — живая строка (цвет здоровья приходит из заливки
# bossbar или ведущего маркера), остальное — ответ на переключение. числа
# форматирует плагин, единицы живут здесь
bars:
  ram:
    title: "<primary>RAM</primary> <secondary>{used} ГБ / {max} ГБ</secondary> <muted>({pct}%)</muted>"
  tps:
    title: "<primary>TPS</primary> <secondary>{tps}</secondary> <muted>· регион {region}</muted> <muted>· сервер {global}</muted>"
  mspt:
    title: "<primary>MSPT</primary> <secondary>{mspt} мс</secondary> <muted>· p95 {p95} мс</muted>"
  players:
    title: "<primary>Онлайн</primary> <secondary>{online}</secondary><muted>/{max}</muted> <muted>({pct}%)</muted>"
  world:
    title: "<primary>{world}</primary> <secondary>{time}</secondary> <muted>· {cycle}% · {weather}</muted>"
    title-plain: "<primary>{world}</primary> <secondary>{time}</secondary>"
    weather-clear: "ясно"
    weather-rain: "дождь"
    weather-thunder: "гроза"
  net:
    title: "<primary>Сеть</primary> <secondary>{servers} серверов</secondary> <muted>· {players} в сети</muted>"
    title-stale: "<primary>Сеть</primary> <secondary>{servers} серверов</secondary> <muted>· {players} в сети</muted> <danger>· {stale} не в сети</danger>"
  toggled-on: "<secondary>{bar}</secondary> <ok>включён</ok> <muted>· {player}</muted>"
  toggled-off: "<secondary>{bar}</secondary> <danger>выключен</danger> <muted>· {player}</muted>"
  no-permission-other: "<danger>нет прав включать бары другим игрокам</danger>"
  player-not-found: "<danger>{player} не в сети</danger>"
  players-only: "<muted>эта форма команды только для игроков</muted>"
  all-empty: "<muted>сейчас нет игроков в сети</muted>"
  all-target: "все в сети"
