name: ServerCore
version: ${version}
main: kz.bejiihiu.servercore.ServerCorePlugin
# quoted on purpose: the description is free text and a bare value with a
# colon breaks yaml parsing, which kills plugin discovery before anything runs
description: '${description}'
api-version: '26.3'
folia-supported: true
load: POSTWORLD

# packetevents must be up before us (its listeners hook the netty pipeline first).
# flectonepulse and placeholderapi are soft pairs — moderation lives there, we
# only read their api; without papi the placeholders are simply absent.
# luckperms is the permissions authority (soft: without it the plugin falls
# back to the static config map); load-before so its api is present at enable.
dependencies:
  server:
    # the id must match packetevents' own plugin name exactly - paper resolves
    # plugin dependencies case-sensitively, "PacketEvents" reads as missing
    packetevents:
      load: BEFORE
      required: true
      join-classpath: true
    FlectonePulse:
      load: BEFORE
      required: false
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    LuckPerms:
      load: BEFORE
      required: false
      join-classpath: true

authors: [ bejiihiu.xs ]
website: https://github.com/bejiihiu/ServerCore
