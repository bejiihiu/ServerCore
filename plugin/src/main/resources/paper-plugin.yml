name: ServerCore
version: ${version}
main: kz.bejiihiu.servercore.ServerCorePlugin
description: ${description}
api-version: '26.3'
folia-supported: true
load: POSTWORLD
bootstrapper: kz.bejiihiu.servercore.boot.ServerCoreBootstrapper

# packetevents must be up before us (its listeners hook the netty pipeline first).
# flectonepulse is a soft pair — moderation lives there, we only read its api.
# luckperms is the permissions authority (soft: without it the plugin falls
# back to the static config map); load-before so its api is present at enable.
dependencies:
  server:
    PacketEvents:
      load: BEFORE
      required: true
      join-classpath: true
    FlectonePulse:
      load: BEFORE
      required: false
      join-classpath: true
    LuckPerms:
      load: BEFORE
      required: false
      join-classpath: true

authors: [ bejiihiu.xs ]
website: https://github.com/bejiihiu/ServerCore
