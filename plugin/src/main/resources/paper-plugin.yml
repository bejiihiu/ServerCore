name: ServerCore
version: ${version}
main: kz.bejiihiu.servercore.ServerCorePlugin
description: ${description}
api-version: '26.3'
folia-supported: true
load: POSTWORLD

# packetevents must be up before us (its listeners hook the netty pipeline first).
# flectonepulse and placeholderapi are soft pairs — moderation lives there, we
# only read their api; without papi the placeholders are simply absent.
dependencies:
  server:
    PacketEvents:
      load: BEFORE
      required: true
      join-classpath: true
    FlectonePulse:
      load: BEFORE
      required: false
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true

authors: [ bejiihiu.xs ]
website: https://github.com/bejiihiu/ServerCore
