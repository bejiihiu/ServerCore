# servercore plugin configuration
#
# the backend link is required to boot: an unusable backend block is a boot
# blocker (the plugin logs "config error: ..." and disables itself instead of
# running half-connected). fill in backend.url and backend.secret before the
# first start. once enabled, an unreachable backend degrades gracefully:
# new logins fail closed, guests keep working from local state.

backend:
  # full websocket url of the backend gateway, wss://host:port/path
  # ws:// for local, wss:// in production (tls terminates at the proxy)
  url: ""
  # unique id of this game server, mirrors SERVERCORE_SERVER_CREDENTIALS key
  # allowed characters: a-z 0-9 . _ -
  server-id: "game-1"
  # per-server hmac secret: at least 32 characters, matching the value stored
  # for this server id in the backend's SERVERCORE_SERVER_CREDENTIALS
  # (openssl rand -hex 32). never commit the real value, keep it in the
  # server environment
  secret: ""
  # reconnect backoff: starts at initial, doubles up to max, with jitter.
  # older configs may carry the flat backend.reconnect-initial-seconds and
  # backend.reconnect-max-seconds keys instead; they stay honored as a
  # fallback when the nested keys below are absent
  reconnect:
    initial-delay-seconds: 2
    max-delay-seconds: 120
  # periodic liveness message cadence
  heartbeat-interval-seconds: 15
  # an unacknowledged frame waits this long before the first retry
  ack-timeout-milliseconds: 10000
  # retries after the first ack timeout; after that durable frames park on
  # disk until the link returns, the rest are dropped (fresh ones follow)
  ack-max-retries: 2
  # no inbound frame for this long on a "connected" socket = half-open link,
  # force reconnect. the backend acks every heartbeat, so a healthy link
  # speaks at least once per heartbeat interval
  liveness-timeout-milliseconds: 45000
  # how long a processed backend push is remembered, a redelivered copy inside
  # the window is acked but never applied twice
  dedupe-ttl-milliseconds: 600000
  # hard cap of the durable outbox file (guest lifecycle frames)
  outbox-max-entries: 500

guest:
  # master switch. when off, unauthenticated players are kicked with the
  # register message instead of entering guest mode
  enabled: true
  # rebuild guest sessions and restore snapshots after a server restart
  restore-on-restart: true
  # how long the ws-backed account check may take before we fall back to
  # local state (fail closed to guest, never to authorized)
  resolve-timeout-milliseconds: 4000
  # max guest sessions per player. every join without authorization burns one;
  # successful authorization resets the budget
  session-limit: 3
  # past the limit: true = kick with a register-now message,
  # false = let them keep looking around but show a loud warning
  kick-after-limit: true
  # subtle actionbar reminder while a guest waits for authorization
  reminder-interval-seconds: 60
  # how often the gamemode drift sweep re-checks that a guest is still in
  # spectator (another plugin may force a different mode); actual corrections
  # are throttled further so it never becomes a per-tick fight
  gamemode-sweep-seconds: 2
  # ui language, picks locales/<lang>.yml (bundled: en, ru)
  # (one store: feature copy and toolkit surfaces share it)
  lang: ru
  # telegram bot username, used for the fallback deep link when the backend
  # has not handed out a personal one-time link yet
  bot-username: ServerCoreBot
  # personal deep links are one-time tokens, they stop being shown after this
  link-ttl-milliseconds: 90000
  # durable snapshot storage, relative to plugins/ServerCore/
  snapshot-storage-path: guest-snapshots.json
  # command names a guest may run (no slash). /link is answered by the plugin
  # itself and shows the registration prompt
  command-whitelist:
    - help
    - rules
    - link
  # per-guest interaction toggles, true = blocked. free flight and world
  # observation are always allowed and cannot be turned off here
  restrictions:
    block-interaction: true
    block-break: true
    block-place: true
    item-pickup: true
    item-use: true
    container-interaction: true
    entity-damage: true
    # non-whitelisted commands
    commands: true
    gamemode-change: true
    portals: true
    inventory-edit: true
    # full chat isolation: the guest neither sees nor writes chat
    chat: true
  # last-known-state overrides that work even with the backend down.
  # offline-mode uuids come from nicknames, so treat these as convenience
  # bookkeeping, the backend telegram binding is the real authority
  # local-accounts:
  #   "069a79f4-44e9-4726-a5be-fca90e38aaf5": authorized

anti-esp:
  enabled: true
  max-distance: 48
  check-interval-ticks: 10
  sneak-hides: true
  disguise:
    enabled: true
    # comma-separated bukkit entity type names; unknown names are dropped and
    # an empty result falls back to the default set. a yaml list is not read.
    mobs: zombie, skeleton, spider, cow, pig, sheep
  cache:
    ttl-ticks: 40

# server info bars: live server health as a per-player toggle. purpur-style
# commands (/rambar, /tpsbar, /msptbar, /playersbar, /worldbar), but the toggle
# is remembered across relogs and the tps/mspt bars show the player's own
# region, not an invented server-wide number.
bars:
  # master switch. off = nothing renders and no bar command is registered
  enabled: true
  # how often every open bar refreshes, game ticks (20 = once a second). the
  # ram sample is taken off-thread on this cadence; tps is read at refresh time
  # on the player's own region thread
  update-interval-ticks: 20
  # where a bar renders: bossbar (progress bar over the hotbar) or actionbar
  display: bossbar
  ram:
    enabled: true
    # heap fill percent: at or below good = healthy, above medium = critical
    good: 60
    medium: 80
  tps:
    enabled: true
    # region tps: at or above good = healthy, below medium = critical
    good: 18.0
    medium: 15.0
  mspt:
    enabled: true
    # region tick time in ms (folia's 5s region report): at or below good =
    # healthy, above medium = the region is missing its 50ms budget
    good: 40.0
    medium: 50.0
  players:
    enabled: true
  world:
    enabled: true
    # true = world, clock and weather; false hides the weather word and keeps
    # the world name plus the clock
    show-weather: true

spec:
  enabled: true
  live-inventory: true
  # minimum gap between live inventory view updates, milliseconds
  live-inventory-push-milliseconds: 500
  # periodic full re-sync of the live view, seconds; catches changes no event
  # reported (e.g. plugin-side inventory edits)
  live-inventory-full-resync-seconds: 5
  log-to-audit: true
  permission:
    # luckperms is the permission backend when installed, vanilla checks otherwise
    use-luckperms: true
    # access levels, highest first: membership in a listed group grants that level
    levels: [owner, admin, moderator, helper]
    # the standalone node that also grants access (moderators per product decision)
    spec-permission: servercore.spec
    # level index granted by spec-permission alone when no listed group matches
    fallback-level: helper
  audit:
    # local append-only audit trail (jsonl), relative to plugins/ServerCore/;
    # files rotate daily as spec-audit-YYYY-MM-DD.jsonl. the backend keeps the
    # same events in its own audit_logs collection
    directory: audit
    # rotated files older than this are deleted
    retention-days: 30
    # audit rows allowed per single session, overflow is dropped
    max-entries-per-session: 64
    # bounded write buffer, a full buffer drops entries instead of blocking
    queue-capacity: 1024
  hidden:
    # how a trace (particle/sound packet aimed at the observed player) gets
    # attributed to the watching admin: by proximity to the admin's position.
    # a spectator admin following their target stands within arm's reach of
    # them, so a bigger radius also starts eating the target's own effects -
    # keep this small and treat it as a stealth/fidelity trade, not a switch
    trace-radius: 1.5
    # drop every actionbar line toward an observed player during a session.
    # an actionbar packet carries no position or origin, so this is all or
    # nothing per session: on = maximum stealth, off = the target keeps every
    # normal server feedback line while being watched
    suppress-action-bar: true

protection:
  # master switch for the whole stack: command denial, gamemode guard,
  # command block audit
  enabled: true
  # commands players may never run, op or not. aliases are resolved against
  # the live command tree (tp/teleport, plugin aliases, commands.yml), so
  # listing one name covers its whole alias group. namespace prefixes are
  # ignored when matching: minecraft:tp and tp are the same command
  blocked-commands:
    - op
    - deop
    - fill
    - clone
    - setblock
    - summon
    - gamemode
    - tp
    - teleport
    - give
    - item
    - execute
    - effect
    - attribute
    - kill
    - difficulty
    - time
    - weather
    - gamerule
    - worldborder
    - stop
    - reload
  # commands that hand execution to datapack code — a function can carry any
  # blocked command inside, so its invocation paths are denied for players too
  blocked-datapack-commands:
    - function
    - schedule
    - datapack
  # non-survival gamemodes are only allowed through sanctioned servercore
  # flows (guest sessions, /spec, override registry); everything else is
  # cancelled and drifted modes are reverted by a periodic sweep
  enforce-gamemode: true
  # how often the drift sweep runs, seconds; 0 = off
  gamemode-sweep-interval-seconds: 30
  # how often loaded chunks are scanned for command blocks carrying a denied
  # command (no execution event exists for blocks); 0 = audit off. chunk load
  # events are always audited
  command-block-audit-interval-seconds: 600
  # clear a denied command from the block itself, not only log it
  command-block-neutralize: false
  # strip denied commands from the client command list (tab completion) —
  # display only, enforcement happens at execution time
  hide-from-tab-complete: true

# permissions live in LuckPerms (soft-depend). when LuckPerms is installed on
# the server, everything below is ignored — groups and nodes are managed
# through LuckPerms itself. this section is only read without LuckPerms: a
# static, config-driven stand-in so the plugin still boots and admins keep
# access. it is never a replacement for real group management.
luckperms:
  fallback:
    # group handed to every player the static map knows nothing about
    default-group: default
    # static group overrides, uuid -> group name (rank ordering only)
    groups:
      # "069a79f4-44e9-4726-a5be-fca90e38aaf5": admin
    # static permission grants, only checked while LuckPerms is absent
    permissions:
      # nodes granted to every player
      everyone: []
      # per-player nodes: exact nodes or prefix wildcards ("servercore.*")
      players:
        # "069a79f4-44e9-4726-a5be-fca90e38aaf5":
        #   - servercore.admin
        #   - servercore.spec

placeholders:
  # how long a rendered placeholder value is memoized before recomputing
  cache-ttl-milliseconds: 2000
  # string for a player this server has never seen
  unknown-value: "unknown"
  # while the backend link is down, backend-derived facts older than this
  # get the stale suffix instead of being re-fetched (placeholders never
  # block on the network)
  stale-after-minutes: 10
  # suffix appended to stale backend-derived values
  stale-suffix: " (stale)"

# flectonepulse is the moderation and chat authority on this server.
# servercore never issues bans/mutes/warns/kicks, never formats chat and
# never ships prefixes - it only reads the public flectonepulse api artifact
# (net.flectone.pulse:api, compile-only) and consults punishment state when a
# decision needs it. flectonepulse itself must be installed for any of this
# to be active; without it servercore simply runs without punishment lookups.
flectonepulse:
  # telegram de-duplication. flectonepulse ships its own telegram module, and
  # when that module is enabled it is the one announcing events - servercore
  # then keeps its ops notifications out of telegram so nothing is announced
  # twice. true (recommended) = suppress servercore's telegram announcements
  # whenever flectonepulse's telegram module is active. false = servercore
  # announces regardless of what flectonepulse does.
  disable-tg: true
  # how long a punishment lookup answer stays cached, seconds. the cache is
  # invalidated early by flectonepulse player events, so this is just the
  # safety net.
  punishment-cache-ttl-seconds: 30

# ops configuration
# every knob lives under ops:; secrets never go here - the panel api key and
# the github token are read from environment variables named below.

ops:
  update:
    # self-update from github releases (tags build-*)
    enabled: true
    # owner/repo to poll for the latest build-* release
    repo: "bejiihiu/ServerCore"
    # how often to check, minutes
    check-interval-minutes: 30
    # restart automatically after a verified swap; false = install and wait
    # for a manual/scheduled restart
    auto-restart: true
    # env var holding a github token (optional, lifts the api rate limit)
    github-token-env: "GITHUB_TOKEN"

  restart:
    # pterodactyl panel integration. all three values empty = feature off,
    # restarts fall back to a console `stop` - which only acts like a restart
    # when the server has AUTO-RESTART enabled in the panel.
    pterodactyl:
      # base url, e.g. https://panel.example.com
      panel-url: ""
      # the identifier of this server in the panel (the short id from the url)
      server-id: ""
      # env var with a pterodactyl CLIENT api key (ptlc_...)
      api-key-env: "PTERO_API_KEY"

    # daily restart times, wall clock hh:mm, europe/moscow
    daily-times: ["05:00"]
    # seconds of in-game warning (title + actionbar countdown) before kick
    grace-seconds: 60
    # player-facing texts: ru | en
    locale: "ru"
    # timezone for daily-times and logs (any java zone id)
    timezone: "Europe/Moscow"
