# ServerCore locale: en (base layer)
#
# mirror of locales/ru.yml: the same nested keys, the same theme tokens, the
# same placeholder syntax. the plugin bundles this file as the base layer:
# a key missing from the active language falls back to this one, and a key
# missing everywhere renders as the key itself.
#
# the backend does not push this locale today (it serves the canonical ru
# bundle); the seed travels in the plugin jar and can be pushed over
# LOCALE_PUSH when the backend learns to serve it.
#
# copy rules: lowercase headers, no exclamation marks, no trailing periods on
# short lines, one thought per line. the tone is a quiet gatekeeper, not a
# salesman.

tablist:
  header: "<gold>◆</gold> <primary>closed season</primary>"
  footer: "<muted>second wave · access by pass</muted>"

guest:
  welcome:
    title: "<primary>guest pass</primary>"
    subtitle: "<secondary>session <gold>{n}</gold> of <gold>{max}</gold> · the world is open to look around</secondary>"
    card: |
      <gold>guest pass</gold>
      <secondary>the world is open, interaction is limited</secondary>
      <secondary>session <gold>{n}</gold> of <gold>{max}</gold></secondary>
      <muted>full access unlocks after approval</muted>
  welcome-back:
    subtitle: "<secondary>entry point restored · session <gold>{n}</gold> of <gold>{max}</gold></secondary>"
  link-prompt:
    - "<secondary>register through the Telegram bot to play</secondary>"
    - "<secondary>login link</secondary> <click:open_url:'{link}'><underlined><gold>{link}</gold></underlined></click>"
  restriction:
    actionbar: "<danger>guest mode: action locked · register with /link</danger>"
  reminder:
    actionbar: "<secondary>registration:</secondary> <gold>{link}</gold>"
  limit:
    warning:
      title: "<danger>guest session limit</danger>"
      subtitle: "<secondary>registering through the Telegram bot unlocks play</secondary>"
    last-session: "<warn>last guest session</warn> <muted>·</muted> <secondary>register through the bot</secondary>"
    chat:
      - "<danger>guest sessions used up: {limit} of {limit}</danger>"
      - "<secondary>world open until you leave · play needs sign-up</secondary>"
      - "<gold>{link}</gold>"
  mute-notice: "<secondary>you are muted — chat stays silent until it ends</secondary>"
  kick:
    limit:
      - "<danger>guest sessions used up: {limit}</danger>"
      - "<secondary>registering through the Telegram bot unlocks play</secondary>"
      - "<gold>{link}</gold>"
    banned:
      - "<danger>your access to this server is restricted</danger>"
      - "<secondary>if this is a mistake, contact the staff in the bot</secondary>"
    disabled:
      - "<danger>this server is registration only</danger>"
      - "<secondary>register through the Telegram bot</secondary>"
      - "<gold>{link}</gold>"

auth:
  prompt:
    card: |
      <gold>sign-in confirmation</gold>
      <secondary>code: <bold><gold>{code}</gold></bold></secondary>
      <secondary>send the code to the bot to confirm the login</secondary>
      <muted>without confirmation the session closes by timer</muted>
  pulse: "<primary>code <gold>{code}</gold> — confirm the login in the bot</primary>"
  window: "<gold>{code}</gold> <muted>·</muted> <secondary>{time} left</secondary>"
  expired: "the confirmation window has closed"
  approved:
    title: "<ok>access granted</ok>"
    subtitle: "<secondary>registration confirmed · guest mode lifted</secondary>"

# disconnect screen when the backend revoked the account
account:
  revoked:
    - "<danger>account deleted</danger>"
    - "<secondary>access revoked · if this is a mistake, contact the staff</secondary>"

spec:
  inventory-title: "<secondary>inventory</secondary> <muted>·</muted> <gold>{target}</gold>"
  started: "<ok>observing</ok> <primary>{target}</primary> <secondary>· exit with /spec</secondary>"
  exited: "<ok>observation ended, your state has been restored</ok>"
  aborted: "<danger>observation of {target} did not start</danger>"
  disabled: "<danger>observation is disabled on this server</danger>"
  no-target: "<danger>{target} is offline</danger>"
  self: "<danger>you cannot observe yourself</danger>"
  busy-admin: "<danger>you already observe {target} · end the session first</danger>"
  busy-target: "<danger>{target} is already observed by another staff member</danger>"
  not-observing: "<secondary>you are not observing anyone</secondary>"
  denied-permission: "<danger>no access to observation</danger>"
  denied-level: "<danger>{target} has a higher access level than yours</danger>"

protection:
  denied:
    chat: "<danger>command <bold>{command}</bold> is not available on this server</danger>"

# admin debug command: /servercore groups <player>
luckperms:
  groups:
    usage: "<secondary>usage:</secondary> <gold>/servercore groups {arg}</gold>"
    no-permission: "<danger>no permission for this command</danger>"
    player-not-found: "<danger>{player} is offline</danger>"
    header: "<secondary>groups</secondary> <primary>{player}</primary>"
    entry: "<muted>▸</muted> <primary>{group}</primary><muted>{primary}</muted>"
    primary-mark: " · primary"
    none: "<muted>the player has no groups</muted>"
    lookup-failed: "<danger>could not read the groups · details in the log</danger>"

# %servercore_*% placeholder values: plain text for placeholderapi, no tags
placeholders:
  "yes": "yes"
  "no": "no"
  status:
    active: "active"
    banned: "banned"
    guest: "guest"
  application:
    voting: "voting"
    approved: "approved"
    rejected: "rejected"
    expired: "expired"
  last-seen:
    now: "now"
    minutes: "{n} min ago"
    hours: "{n} h ago"
    days: "{n} d ago"
  duration:
    h: "{n}h"
    m: "{n}m"
    s: "{n}s"

countdown:
  tick: "<secondary>time is running out</secondary>"

# server info bars: /rambar, /tpsbar, /msptbar, /playersbar and /worldbar. the
# bar title is the live line (health coloring comes from the bossbar fill or
# the leading mark), the rest is toggle feedback. numbers are formatted by the
# plugin, units live here
bars:
  ram:
    title: "<primary>RAM</primary> <secondary>{used} GB / {max} GB</secondary> <muted>({pct}%)</muted>"
  tps:
    title: "<primary>TPS</primary> <secondary>{tps}</secondary> <muted>· region {region}</muted> <muted>· server {global}</muted>"
  mspt:
    title: "<primary>MSPT</primary> <secondary>{mspt} ms</secondary> <muted>· p95 {p95} ms</muted>"
  players:
    title: "<primary>Online</primary> <secondary>{online}</secondary><muted>/{max}</muted> <muted>({pct}%)</muted>"
  world:
    title: "<primary>{world}</primary> <secondary>{time}</secondary> <muted>· {cycle}% · {weather}</muted>"
    title-plain: "<primary>{world}</primary> <secondary>{time}</secondary>"
    weather-clear: "clear"
    weather-rain: "rain"
    weather-thunder: "thunder"
  toggled-on: "<secondary>{bar}</secondary> <ok>on</ok> <muted>· {player}</muted>"
  toggled-off: "<secondary>{bar}</secondary> <danger>off</danger> <muted>· {player}</muted>"
  no-permission-other: "<danger>no permission to toggle bars for other players</danger>"
  player-not-found: "<danger>{player} is offline</danger>"
  players-only: "<muted>this form of the command is for players only</muted>"
  all-empty: "<muted>nobody is online right now</muted>"
  all-target: "everyone online"
